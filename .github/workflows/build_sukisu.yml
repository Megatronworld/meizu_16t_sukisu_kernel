name: Build Meizu 16T Pure SukiSU Kernel (V250)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 严格检出魅族 16T sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1

      - name: 2. 安装完备的交叉编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 3. 集成 SukiSU-Ultra 并修复类型、原子操作、调度与 RC 中断宏兼容
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          cat << 'COMPAT' > include/linux/sukisu_compat.h
          #ifndef _SUKISU_COMPAT_H
          #define _SUKISU_COMPAT_H

          #ifndef __ASSEMBLY__
          #include <linux/types.h>
          #ifndef __user
          #define __user
          #endif
          #ifndef _SIZE_T
          #define _SIZE_T
          typedef __SIZE_TYPE__ size_t;
          #endif
          #ifndef _LOFF_T
          #define _LOFF_T
          typedef long long loff_t;
          #endif
          struct pt_regs;
          struct ctl_table;
          #ifndef _LINUX_SYSCALL_FN_T_DEFINED
          #define _LINUX_SYSCALL_FN_T_DEFINED
          typedef long (*syscall_fn_t)(const struct pt_regs *);
          #endif

          __attribute__((weak)) unsigned long nohz_flags(int cpu) { return 0; }
          __attribute__((weak)) void trace_sched_load_balance_skip_tasks(void *a, void *b) {}
          __attribute__((weak)) void mark_reserved(int cpu) {}
          __attribute__((weak)) int sched_updown_migrate_handler(struct ctl_table *table, int write, void __user *buffer, size_t *lenp, loff_t *ppos) { return 0; }
          #endif

          #ifndef FULL_THROTTLE_BOOST
          #define FULL_THROTTLE_BOOST 0
          #endif
          #ifndef CONSERVATIVE_BOOST
          #define CONSERVATIVE_BOOST 0
          #endif
          #ifndef NO_BOOST
          #define NO_BOOST 0
          #endif
          #ifndef EFI_HAVE_STUB
          #define EFI_HAVE_STUB 1
          #endif

          #endif
          COMPAT

          cat << 'PYEOF' > /tmp/fix_compat.py
          import os
          import re

          p_atomic = 'arch/arm64/include/asm/atomic_ll_sc.h'
          if os.path.exists(p_atomic):
              txt = open(p_atomic, 'r', encoding='utf-8', errors='ignore').read()
              txt = re.sub(r'"(Ir|i|K|L|M|N)"', '"r"', txt)
              open(p_atomic, 'w', encoding='utf-8').write(txt)

          p_nohz = 'include/linux/sched/nohz.h'
          if os.path.exists(p_nohz):
              txt = open(p_nohz, 'r', encoding='utf-8', errors='ignore').read()
              if 'NOHZ_BALANCE_KICK' not in txt:
                  txt = txt + '\nenum { NOHZ_BALANCE_KICK = 2 };\n'
                  open(p_nohz, 'w', encoding='utf-8').write(txt)

          p_sched_core = 'kernel/sched/core.c'
          if os.path.exists(p_sched_core):
              txt = open(p_sched_core, 'r', encoding='utf-8', errors='ignore').read()
              if 'NOHZ_BALANCE_KICK' not in txt:
                  txt = 'enum { NOHZ_BALANCE_KICK = 2 };\n' + txt
                  open(p_sched_core, 'w', encoding='utf-8').write(txt)

          for d in ['kernel/ksu', 'drivers/kernelsu']:
              if os.path.exists(d):
                  for r, ds, fs in os.walk(d):
                      for f in fs:
                          if f.endswith('.c'):
                              fp = os.path.join(r, f)
                              txt = open(fp, 'r', encoding='utf-8', errors='ignore').read()
                              if 'sukisu_compat.h' not in txt:
                                  open(fp, 'w', encoding='utf-8').write('#include <linux/sukisu_compat.h>\n' + txt)
                          if f.endswith(('.c', '.h')):
                              fp = os.path.join(r, f)
                              txt = open(fp, 'r', encoding='utf-8', errors='ignore').read()
                              txt = re.sub(r'trace_sched_.*?;', '/* removed */', txt)
                              txt = re.sub(r'sched_boost\s*\([^)]*\);', '/* removed */', txt)
                              open(fp, 'w', encoding='utf-8').write(txt)

          boost_def = '#undef FULL_THROTTLE_BOOST\n#define FULL_THROTTLE_BOOST 0\n'
          for p in ['kernel/sched/rt.c', 'kernel/sched/fair.c']:
              if os.path.exists(p):
                  txt = open(p, 'r', encoding='utf-8', errors='ignore').read()
                  if boost_def not in txt:
                      txt = boost_def + txt
                  txt = re.sub(r'sched_boost\s*\(\)\s*=\s*FULL_THROTTLE_BOOST\s*;', '/* removed invalid lvalue */', txt)
                  open(p, 'w', encoding='utf-8').write(txt)

          if os.path.exists('kernel/sched'):
              for r, ds, fs in os.walk('kernel/sched'):
                  for f in fs:
                      if f.endswith('.c') and f not in ('rt.c', 'fair.c'):
                          fp = os.path.join(r, f)
                          txt = open(fp, 'r', encoding='utf-8', errors='ignore').read()
                          if 'FULL_THROTTLE_BOOST' in txt and boost_def not in txt:
                              open(fp, 'w', encoding='utf-8').write(boost_def + txt)

          p_efi = 'drivers/firmware/efi/libstub/arm64-stub.c'
          if os.path.exists(p_efi):
              lines = open(p_efi, 'r', encoding='utf-8', errors='ignore').readlines()
              out_lines = []
              has_guard = any('TEXT_OFFSET' in l and ('#ifndef' in l or '#define' in l) for l in lines)
              if not has_guard:
                  out_lines.append('#ifndef TEXT_OFFSET\n#define TEXT_OFFSET 0\n#endif\n')
              for l in lines:
                  if l.lstrip().startswith('#'):
                      out_lines.append(l)
                  else:
                      out_lines.append(re.sub(r'\bTEXT_OFFSET\b', '0', l))
              open(p_efi, 'w', encoding='utf-8').writelines(out_lines)

          p_huge = 'mm/huge_memory.c'
          if os.path.exists(p_huge):
              content = open(p_huge, 'r', encoding='utf-8', errors='ignore').read()
              content = content.replace('try_to_unmap(page, ttu_flags);', 'try_to_unmap(page, (enum ttu_flags)ttu_flags);')
              open(p_huge, 'w', encoding='utf-8').write(content)
          PYEOF

          python3 /tmp/fix_compat.py || true
          find . -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | xargs sed -i '/#error/d' || true

      - name: 4. 注入 VDSO 桩与清理状态
        run: |
          git checkout Makefile arch/arm64/Makefile arch/arm64/kernel/signal.c || true
          if [ -f arch/arm64/Makefile ]; then
            sed -i '/vdso_prepare/s/^/# /' arch/arm64/Makefile || true
          fi
          mkdir -p include/generated arch/arm64/include/generated
          printf "#ifndef __VDSO_OFFSETS_H\n#define __VDSO_OFFSETS_H\n#define vdso_offset_sigtramp 0\n#define vdso_offset_rt_sigtramp 0\n#endif\n" > include/generated/vdso-offsets.h
          cp include/generated/vdso-offsets.h arch/arm64/include/generated/vdso-offsets.h || true
          printf "gcc-plugins:\n\t@true\nall:\n\t@true\nclean:\n\t@true\n" > scripts/Makefile.gcc-plugins

      - name: 5. 智能匹配配置与绝对纯净的 prepare0 预生成
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          CONFIG_FILE=$(find arch/arm64/configs -type f \( -iname "*16t*" -o -iname "*meizu*" -o -iname "*sm8150*" -o -iname "*sdm855*" \) | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=$(find arch/arm64/configs -type f -name "*_defconfig" ! -name "defconfig" | head -n 1)
          fi
          if [ -n "$CONFIG_FILE" ]; then
            CONFIG_REL=${CONFIG_FILE#arch/arm64/configs/}
            echo "Using config file: $CONFIG_FILE (target: $CONFIG_REL)"
            make O=out "$CONFIG_REL" || make O=out alldefconfig
          else
            echo "No specific defconfig found, falling back to alldefconfig"
            make O=out alldefconfig
          fi

          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_KRETPROBES is not set/CONFIG_KRETPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_HAVE_SYSCALL_TRACEPOINTS is not set/CONFIG_HAVE_SYSCALL_TRACEPOINTS=y/g' out/.config || true
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS=n/g' out/.config || true
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO=n/g' out/.config || true
          sed -i 's/CONFIG_EFI_STUB=y/# CONFIG_EFI_STUB is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/g' out/.config || true
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KRETPROBES=y" >> out/.config
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y" >> out/.config
          echo "CONFIG_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          echo "# CONFIG_EFI_STUB is not set" >> out/.config
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> out/.config
          echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set" >> out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

          yes "" | make O=out oldconfig
          sed -i 's/CONFIG_EFI_STUB=y/# CONFIG_EFI_STUB is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/g' out/.config || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          make O=out -j`nproc` CC=aarch64-linux-gnu-gcc HOSTCC=gcc HOSTCFLAGS="-std=gnu89 -fcommon" KCFLAGS="-w -Wno-error -include linux/sukisu_compat.h" CROSS_COMPILE=aarch64-linux-gnu- prepare0

      - name: 6. 正式全速编译内核镜像并修复 vmlinux.lds 链接脚本
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          if [ ! -e arch/arm64/include/asm/sizes.h ] && [ -f include/asm-generic/sizes.h ]; then
            printf "#include <asm-generic/sizes.h>\n" > arch/arm64/include/asm/sizes.h
          fi
          rm -f arch/arm64/kernel/vmlinux.lds
          KBUILD_ARGS=(
            O=out
            -j`nproc`
            CC=aarch64-linux-gnu-gcc
            HOSTCC=gcc
            HOSTCFLAGS="-std=gnu89 -fcommon"
            HOSTLDFLAGS="-fcommon"
            CROSS_COMPILE=aarch64-linux-gnu-
            KCFLAGS="-w -Wno-error -include linux/sukisu_compat.h -include linux/sched.h -DCLONE_VM=0x100 -DCLONE_FS=0x200 -DCLONE_FILES=0x400 -DCLONE_SIGHAND=0x800 -DCLONE_NEWNS=0x20000 -DCLONE_SYSVSEM=0x40000"
            CONFIG_NO_ERROR_ON_MISMATCH=y
          )
          make "${KBUILD_ARGS[@]}" || true
          mkdir -p out/arch/arm64/kernel
          if [ ! -s out/arch/arm64/kernel/vmlinux.lds ] && [ -f arch/arm64/kernel/vmlinux.lds.S ]; then
            AUTOCONF_INC=""
            [ -f out/include/generated/autoconf.h ] && AUTOCONF_INC="-include out/include/generated/autoconf.h"
            aarch64-linux-gnu-gcc -E -P -C -x assembler-with-cpp \
              $AUTOCONF_INC \
              -Iinclude \
              -Iinclude/asm-generic \
              -Iarch/arm64/include \
              -Iarch/arm64/include/generated \
              -Iout/include \
              -Iout/include/generated \
              -Iout/arch/arm64/include \
              -Iout/arch/arm64/include/generated \
              -D__ASSEMBLY__ \
              -DCONFIG_64BIT \
              arch/arm64/kernel/vmlinux.lds.S -o out/arch/arm64/kernel/vmlinux.lds || true
          fi
          if [ -s out/arch/arm64/kernel/vmlinux.lds ]; then
            awk '!/^[[:space:]]*(#|$|extern |typedef |__attribute__)/' out/arch/arm64/kernel/vmlinux.lds > /tmp/vmlinux.lds.clean && mv /tmp/vmlinux.lds.clean out/arch/arm64/kernel/vmlinux.lds || true
            cp out/arch/arm64/kernel/vmlinux.lds arch/arm64/kernel/vmlinux.lds
          fi
          make "${KBUILD_ARGS[@]}"

      - name: 7. 生成 AnyKernel3 刷机包并上传
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=`find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1`
          if [ -z "$IMG_PATH" ]; then
            echo "Error: Kernel image not found!"
            exit 1
          fi
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel && zip -r ../Meizu-16T-PureSukiSU-Kernel.zip *

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-PureSukiSU-Kernel
          path: Meizu-16T-PureSukiSU-Kernel.zip
