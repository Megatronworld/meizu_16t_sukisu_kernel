name: Build Meizu 16T Pure SukiSU Kernel (V174)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 严格检出魅族 16T sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1

      - name: 2. 安装完备的交叉编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 3. 集成 SukiSU-Ultra 并强制全局注入 task_struct 完整声明
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # 3.1 在 sched.h 顶部全局强制声明 struct task_struct
          python3 -c "import os; p='include/linux/sched.h'; open(p, 'w', encoding='utf-8').write('struct task_struct;\n#ifndef NOHZ_BALANCE_KICK\n#define NOHZ_BALANCE_KICK 0\n#endif\n#ifndef FULL_THROTTLE_BOOST\n#define FULL_THROTTLE_BOOST 0\n#endif\n' + open(p, 'r', encoding='utf-8', errors='ignore').read()) if os.path.exists(p) else None" || true
          
          python3 -c "import os; p='include/linux/irq.h'; open(p, 'w', encoding='utf-8').write(open(p, 'r', encoding='utf-8', errors='ignore').read() + '\n#ifndef IRQ_NOPROBE\n#define IRQ_NOPROBE 16\n#endif\n#ifndef IRQ_NOAUTOEN\n#define IRQ_NOAUTOEN 33554432\n#endif\n#ifndef IRQ_WAKE_THREAD\n#define IRQ_WAKE_THREAD 16777216\n#endif\n#ifndef IRQ_PER_CPU\n#define IRQ_PER_CPU 512\n#endif\n#ifndef IRQ_NOOTHREAD\n#define IRQ_NOOTHREAD 67108864\n#endif\n#ifndef IRQ_PER_CPU_DEVID\n#define IRQ_PER_CPU_DEVID 1024\n#endif\n') if os.path.exists(p) else None" || true
          python3 -c "import os; p='arch/arm64/kernel/asm-offsets.c'; open(p, 'w', encoding='utf-8').write('#include <linux/sched.h>\n' + open(p, 'r', encoding='utf-8', errors='ignore').read()) if os.path.exists(p) else None" || true
          python3 -c "import os; p='kernel/fork.c'; open(p, 'w', encoding='utf-8').write('#include <linux/sched/task.h>\n#ifndef CLONE_VM\n#define CLONE_VM 0x100\n#endif\n#ifndef CLONE_FS\n#define CLONE_FS 0x200\n#endif\n#ifndef CLONE_FILES\n#define CLONE_FILES 0x400\n#endif\n#ifndef CLONE_SIGHAND\n#define CLONE_SIGHAND 0x800\n#endif\n#ifndef CLONE_NEWNS\n#define CLONE_NEWNS 0x20000\n#endif\n#ifndef CLONE_SYSVSEM\n#define CLONE_SYSVSEM 0x40000\n#endif\n' + open(p, 'r', encoding='utf-8', errors='ignore').read()) if os.path.exists(p) else None" || true
          
          
cat << 'EOF' >> .github/workflows/build_sukisu.yml

      - name: 5. 编译内核并打包刷机包
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          CONFIG_FILE=`find arch/arm64/configs -name "*defconfig" | head -n 1`
          CONFIG_NAME=`basename "$CONFIG_FILE"`
          make O=out "$CONFIG_NAME"
          
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_KRETPROBES is not set/CONFIG_KRETPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_HAVE_SYSCALL_TRACEPOINTS is not set/CONFIG_HAVE_SYSCALL_TRACEPOINTS=y/g' out/.config || true
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS=n/g' out/.config || true
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO=n/g' out/.config || true
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KRETPROBES=y" >> out/.config
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y" >> out/.config
          echo "CONFIG_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          
          yes "" | make O=out oldconfig
          make O=out -j`nproc` \
            CC=aarch64-linux-gnu-gcc \
            HOSTCC=gcc \
            HOSTCFLAGS="-std=gnu89 -fcommon" \
            HOSTLDFLAGS="-fcommon" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-w -Wno-error -DIRQ_TYPE_LEVEL_HIGH=4" \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: 6. 生成 AnyKernel3 刷机包并上传
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=`find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1`
          if [ -z "$IMG_PATH" ]; then
            echo "Error: Kernel image not found!"
            exit 1
          fi
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel && zip -r ../Meizu-16T-PureSukiSU-Kernel.zip *

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-PureSukiSU-Kernel
          path: Meizu-16T-PureSukiSU-Kernel.zip
