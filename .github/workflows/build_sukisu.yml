name: Build Meizu 16T SukiSU Ultra Kernel (V125 Fix Checkout)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 严格检出魅族 16T sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1

      - name: 2. 安装完备的交叉编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 3. 下载集成 SukiSU 源码并深度清洗调度冲突
        run: |
          wget https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -O sukisu.zip || wget https://github.com/rsuntk/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
          unzip -q sukisu.zip
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "KernelSU-*" -o -name "SukiSU-*" \))
          if [ -d "$EXTRACTED_DIR/kernel" ]; then
            rm -rf kernel/ksu
            cp -rf "$EXTRACTED_DIR/kernel" kernel/
          else
            cp -rf "$EXTRACTED_DIR"/* ./
          fi
          rm -rf sukisu.zip "$EXTRACTED_DIR"
          find . -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | xargs sed -i '/#error/d' || true

          # 核心手术：直接把 sched/core.c 里引用到 NOHZ_BALANCE_KICK 的地方用安全宏或 0 替代，永绝后患
          python3 -c "
          import os
          for root, dirs, files in os.walk('kernel'):
              for file in files:
                  if file.endswith(('.c', '.h')):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          if 'NOHZ_BALANCE_KICK' in content or 'sched_unisolate_cpu' in content:
                              content = content.replace('NOHZ_BALANCE_KICK', '0 /* compat_kick */')
                              content = content.replace('sched_unisolate_cpu_unlocked', '0 /* compat_uni */')
                              content = content.replace('sched_isolate_cpu', '0 /* compat_iso */')
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(content)
                              print(f'Successfully sanitized: {path}')
                      except Exception:
                          pass
          " || true

      - name: 4. 仅还原 VDSO 相关的 Makefile，保留内核源码手术成果
        run: |
          # 注意：这里千万不 checkout core.c，保护我们的手术成果！
          git checkout Makefile arch/arm64/Makefile arch/arm64/kernel/signal.c || true
          python3 -c "
          import os
          path = 'arch/arm64/Makefile'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              new_lines = [('# ' + line) if 'vdso_prepare' in line else line for line in lines]
              with open(path, 'w', encoding='utf-8') as f:
                  f.writelines(new_lines)
          " || true
          mkdir -p include/generated arch/arm64/include/generated
          printf "#ifndef __VDSO_OFFSETS_H\n#define __VDSO_OFFSETS_H\n#define vdso_offset_sigtramp 0\n#define vdso_offset_rt_sigtramp 0\n#endif\n" > include/generated/vdso-offsets.h
          cp include/generated/vdso-offsets.h arch/arm64/include/generated/vdso-offsets.h || true
          printf "gcc-plugins:\n\t@true\nall:\n\t@true\nclean:\n\t@true\n" > scripts/Makefile.gcc-plugins

      - name: 5. 编译内核并打包刷机包
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          CONFIG_FILE=`find arch/arm64/configs -name "*defconfig" | head -n 1`
          CONFIG_NAME=`basename "$CONFIG_FILE"`
          make O=out "$CONFIG_NAME"
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS is not set/g' out/.config || true
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO=n/g' out/.config || true
          echo "CONFIG_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          yes "" | make O=out oldconfig
          make O=out -j`nproc` \
            CC=aarch64-linux-gnu-gcc \
            HOSTCC=gcc \
            HOSTCFLAGS="-std=gnu89 -fcommon" \
            HOSTLDFLAGS="-fcommon" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-w -Wno-error" \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: 6. 生成 AnyKernel3 刷机包并上传
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=`find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1`
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel && zip -r ../Meizu-16T-SukiSU-Ultra-Kernel.zip *

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-SukiSU-Ultra-Kernel
          path: Meizu-16T-SukiSU-Ultra-Kernel.zip
