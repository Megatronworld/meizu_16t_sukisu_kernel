name: Build Meizu 16T SukiSU Ultra Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出内核源码
        run: |
          git clone --depth=1 https://github.com/Megatronworld/meizu_16t_sukisu_kernel.git . -b main

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip

      - name: 3. 配置 AOSP Clang 编译工具链
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/TravMurav/aosp-clang.git toolchain || git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: 4. 集成 SukiSU Ultra 源码
        run: |
          git clone https://github.com/rsuntk/SukiSU-Ultra.git sukisu || true
          if [ -d sukisu/kernel ]; then
            if [ -f sukisu/kernel/setup.sh ]; then
              bash sukisu/kernel/setup.sh
            else
              cp -rf sukisu/kernel/* ./
            fi
          else
            cp -rf sukisu/* ./ || echo "Failed to copy sukisu"
          fi

      - name: 5. 开始编译内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/bin:$PATH"
          mkdir -p out
          
          # 打印当前目录结构以排查配置文件位置
          echo "Current directory contents:"
          ls -la
          
          # 寻找仓库中所有带有 defconfig 的文件
          find . -name "*defconfig"
          
          # 自动寻找第一个可用的 defconfig 文件名
          CONFIG_FILE=$(find . -name "*defconfig" | head -n 1)
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          echo "Found config: $CONFIG_NAME"
          
          make O=out $CONFIG_NAME
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: 6. 打包为 AnyKernel3 刷机包
        run: |
          git clone https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r ../Meizu-16T-SukiSU-Ultra-Kernel.zip *

      - name: 7. 上传构建刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Meizu 16T SukiSU Ultra Kernel
          path: Meizu-16T-SukiSU-Ultra-Kernel.zip
