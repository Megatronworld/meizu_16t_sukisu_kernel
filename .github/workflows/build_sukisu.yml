name: Build Meizu 16T SukiSU Ultra Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出魅族 sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1 || git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_msm8150.git . -b lineage-20

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld

      - name: 3. V7-下载 AOSP Clang 工具链 (更换稳定镜像源)
        run: |
          mkdir -p toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz || wget https://github.com/X0RW/AOSP-Clang/releases/download/17.0.4/clang-17.0.4.tar.gz -O clang.tar.gz || true
          if [ -f clang.tar.gz ]; then
            tar -C toolchain -xzf clang.tar.gz || true
          fi
          # 如果上面没解压成功，直接用 apt 安装系统自带的 gcc-aarch64
          if [ ! -f "toolchain/bin/clang" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: 4. V7-下载集成 SukiSU Ultra 源码 (wget直连)
        run: |
          wget https://github.com/rsuntk/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
          unzip -q sukisu.zip
          mv SukiSU-Ultra-main sukisu_source
          if [ -d sukisu_source/kernel ]; then
            cp -rf sukisu_source/kernel/* ./
          else
            cp -rf sukisu_source/* ./
          fi

      - name: 5. 暴力删除 VDSO 目录以彻底杜绝报错
        run: |
          rm -rf arch/arm64/kernel/vdso
          rm -rf arch/arm64/vdso

      - name: 6. 开始编译内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/bin:$PATH"
          mkdir -p out
          
          CONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          echo "Using config: $CONFIG_NAME"
          
          make O=out "$CONFIG_NAME"
          
          if [ -f "toolchain/bin/clang" ]; then
            make O=out -j$(nproc) \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              HOSTCFLAGS="-std=gnu89"
          else
            make O=out -j$(nproc) \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              HOSTCFLAGS="-std=gnu89"
          fi

      - name: 7. 打包为 AnyKernel3 刷机包
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=$(find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1)
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel
          zip -r ../Meizu-16T-SukiSU-Ultra-Kernel.zip *

      - name: 8. 上传构建刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-SukiSU-Ultra-Kernel
          path: Meizu-16T-SukiSU-Ultra-Kernel.zip
