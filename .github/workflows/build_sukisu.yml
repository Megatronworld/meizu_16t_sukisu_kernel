name: Build Meizu 16T SukiSU Ultra Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出魅族 sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1 || git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_msm8150.git . -b lineage-20

      - name: 2. 安装完整编译依赖与 arm64 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 3. 下载 AOSP Clang 工具链 (已验证成功)
        run: |
          mkdir -p toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz || true
          if [ -f clang.tar.gz ]; then
            tar -C toolchain -xzf clang.tar.gz || true
          fi

      - name: 4. 下载集成 SukiSU 源码 (已验证成功)
        run: |
          wget https://github.com/tiann/KernelSU/archive/refs/heads/main.zip -O sukisu.zip || wget https://github.com/rsuntk/SukiSU-Ultra/archive/refs/heads/main.zip -O sukisu.zip
          unzip -q sukisu.zip
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "KernelSU-*" -o -name "SukiSU-*" \))
          if [ -d "$EXTRACTED_DIR/kernel" ]; then
            rm -rf kernel/ksu
            cp -rf "$EXTRACTED_DIR/kernel" kernel/
          else
            cp -rf "$EXTRACTED_DIR"/* ./
          fi
          rm -rf sukisu.zip "$EXTRACTED_DIR"

      - name: 5. 恢复原生 Makefile 并构建安全桩
        run: |
          # 核心修复：完全恢复顶层 Makefile，绝不破坏其语法
          git checkout Makefile arch/arm64/Makefile || true

          # 构筑 VDSO 桩与头文件
          mkdir -p arch/arm64/kernel/vdso scripts include/generated
          echo "obj-y :=" > arch/arm64/kernel/vdso/Makefile
          touch arch/arm64/kernel/vdso/vdso.lds
          touch arch/arm64/kernel/vdso/vdso.S
          touch include/generated/vdso-offsets.h

          # 使用标准 Tab 缩进编写 scripts/Makefile.gcc-plugins 桩规则
          printf "gcc-plugins:\n\t@true\nall:\n\t@true\nclean:\n\t@true\n" > scripts/Makefile.gcc-plugins

          # 仅安全重写架构层 vdso_prepare
          if [ -f "arch/arm64/Makefile" ]; then
            sed -i '/--fix-cortex-a53-843419/s/^/#/' arch/arm64/Makefile || true
            sed -i '/vdso_prepare:/,/^\s*$/c\vdso_prepare:\n\t@true' arch/arm64/Makefile || true
          fi

      - name: 6. 开始编译内核 (原生 Makefile 护航，全速冲刺)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/bin:$PATH"
          mkdir -p out
          
          CONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          echo "Using config: $CONFIG_NAME"
          
          make O=out "$CONFIG_NAME"
          
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS is not set/g' out/.config || true
          sed -i 's/CONFIG_HAVE_GCC_PLUGINS=y/# CONFIG_HAVE_GCC_PLUGINS is not set/g' out/.config || true
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO is not set/g' out/.config || true
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' out/.config || true
          sed -i 's/CONFIG_KASAN=y/# CONFIG_KASAN is not set/g' out/.config || true
          
          echo "CONFIG_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_HAVE_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          echo "CONFIG_VDSO32=n" >> out/.config
          echo "CONFIG_KASAN=n" >> out/.config
          
          yes "" | make O=out oldconfig
          
          # 先单独安全构建 dtc 主机工具
          make O=out -j$(nproc) scripts/dtc HOSTCC=gcc HOSTCXX=g++ HOSTCFLAGS="-std=gnu89 -fcommon" || true
          
          # 全速并行编译内核主体
          make O=out -j$(nproc) \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS="-std=gnu89 -fcommon"

      - name: 7. 打包为 AnyKernel3 刷机包
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=$(find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1)
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel
          zip -r ../Meizu-16T-SukiSU-Ultra-Kernel.zip *

      - name: 8. 上传构建刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-SukiSU-Ultra-Kernel
          path: Meizu-16T-SukiSU-Ultra-Kernel.zip
