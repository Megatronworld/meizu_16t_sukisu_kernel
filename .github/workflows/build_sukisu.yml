name: Build Meizu 16T Pure SukiSU Kernel (V142 - Official Main Branch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 严格检出魅族 16T sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1

      - name: 2. 安装完备的交叉编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 3. 严格参照官方文档：使用 main 分支进行动态 Kprobes 挂钩集成
        run: |
          # 官方文档标准命令：使用 SukiSU-Ultra 的 main 分支
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # 清理任何可能残留的不兼容错误宏
          find . -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | xargs sed -i '/#error/d' || true

      - name: 4. 注入 VDSO 桩与清理状态
        run: |
          git checkout Makefile arch/arm64/Makefile arch/arm64/kernel/signal.c || true
          python3 -c "
          import os
          path = 'arch/arm64/Makefile'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              new_lines = [('# ' + line) if 'vdso_prepare' in line else line for line in lines]
              with open(path, 'w', encoding='utf-8') as f:
                  f.writelines(new_lines)
          " || true
          mkdir -p include/generated arch/arm64/include/generated
          printf "#ifndef __VDSO_OFFSETS_H\n#define __VDSO_OFFSETS_H\n#define vdso_offset_sigtramp 0\n#define vdso_offset_rt_sigtramp 0\n#endif\n" > include/generated/vdso-offsets.h
          cp include/generated/vdso-offsets.h arch/arm64/include/generated/vdso-offsets.h || true
          printf "gcc-plugins:\n\t@true\nall:\n\t@true\nclean:\n\t@true\n" > scripts/Makefile.gcc-plugins

      - name: 5. 编译内核并打包刷机包
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          CONFIG_FILE=`find arch/arm64/configs -name "*defconfig" | head -n 1`
          CONFIG_NAME=`basename "$CONFIG_FILE"`
          make O=out "$CONFIG_NAME"
          
          # 按照官方文档要求，为旧内核强制开启 Kprobes 及相关支持，关闭插件和 VDSO 冲突项
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_KRETPROBES is not set/CONFIG_KRETPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_HAVE_SYSCALL_TRACEPOINTS is not set/CONFIG_HAVE_SYSCALL_TRACEPOINTS=y/g' out/.config || true
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS is not set/g' out/.config || true
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO=n/g' out/.config || true
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KRETPROBES=y" >> out/.config
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y" >> out/.config
          echo "CONFIG_GCC_PLUGINS=n" >> out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          
          yes "" | make O=out oldconfig
          make O=out -j`nproc` \
            CC=aarch64-linux-gnu-gcc \
            HOSTCC=gcc \
            HOSTCFLAGS="-std=gnu89 -fcommon" \
            HOSTLDFLAGS="-fcommon" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-w -Wno-error" \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: 6. 生成 AnyKernel3 刷机包并上传
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=`find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1`
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel && zip -r ../Meizu-16T-PureSukiSU-Kernel.zip *

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-PureSukiSU-Kernel
          path: Meizu-16T-PureSukiSU-Kernel.zip
