name: Build Meizu 16T Pure SukiSU Kernel (V268)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 严格检出魅族 16T sm8150 平台内核源码
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.compression false
          for i in 1 2 3 4 5; do
            git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1 && break
            echo "Retry kernel clone ($i/5)..."
            rm -rf ./* .git 2>/dev/null || true
            sleep 3
          done

      - name: 2. 安装完备的交叉编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 3. 集成 SukiSU 并批量修复 4.14 轮询/文件/内存/调度/LSM/fsnotify/task_work/fallthrough/GCC15 兼容问题
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.compression false
          for i in 1 2 3 4 5; do
            rm -rf KernelSU drivers/kernelsu kernel/ksu /tmp/sukisu_src 2>/dev/null || true
            if git clone --depth=1 -b main https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu_src && [ -f /tmp/sukisu_src/kernel/setup.sh ]; then
              (cd /tmp/sukisu_src && bash kernel/setup.sh main) && break
            fi
            curl -LSs --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main && break
            echo "Retry SukiSU setup ($i/5)..."
            sleep 3
          done
          if [ ! -d KernelSU ] && [ -d /tmp/sukisu_src ]; then
            cp -r /tmp/sukisu_src KernelSU
          fi

          cat << 'PGTABLE' > include/linux/pgtable.h
          #ifndef _LINUX_PGTABLE_SHIM_H
          #define _LINUX_PGTABLE_SHIM_H
          #include <linux/mm.h>
          #include <asm/pgtable.h>
          #endif
          PGTABLE

          cat << 'MINMAX' > include/linux/minmax.h
          #ifndef _LINUX_MINMAX_SHIM_H
          #define _LINUX_MINMAX_SHIM_H
          #include <linux/kernel.h>
          #endif
          MINMAX
          mkdir -p include/vdso && : > include/vdso/datapage.h && : > include/vdso/clocksource.h
          cat << 'COMPAT' > include/linux/sukisu_compat.h
          #ifndef _SUKISU_COMPAT_H
          #define _SUKISU_COMPAT_H

          #ifndef __ASSEMBLY__
          #include <linux/types.h>
          #include <linux/string.h>

          #if defined(__has_include)
          #if __has_include(<generated/bounds.h>)
          #include <linux/poll.h>
          #endif
          #endif

          #ifndef __user
          #define __user
          #endif
          #ifndef _SIZE_T
          #define _SIZE_T
          typedef __SIZE_TYPE__ size_t;
          #endif
          #ifndef _LOFF_T
          #define _LOFF_T
          typedef long long loff_t;
          #endif
          #ifndef __HAVE_ARCH___POLL_T
          #define __HAVE_ARCH___POLL_T
          typedef unsigned int __poll_t;
          #endif

          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR 512
          #endif

          /* Linux 5.4+ fallthrough 宏兼容 4.14 */
          #ifndef fallthrough
          #if defined(__has_attribute)
          #if __has_attribute(__fallthrough__)
          /* no fallthrough macro */
          #else
          /* no fallthrough macro */
          #endif
          #else
          /* no fallthrough macro */
          #endif
          #endif

          /* Linux 5.10+ task_work_add notify 模式兼容 4.14 bool notify */
          #ifndef TWA_RESUME
          #define TWA_RESUME true
          #endif
          #ifndef TWA_SIGNAL
          #define TWA_SIGNAL true
          #endif
          #ifndef TWA_NMI
          #define TWA_NMI false
          #endif

          /* EPOLL* -> POLL* 兼容映射（Linux 4.14 轮询接口） */
          #ifndef POLLIN
          #define POLLIN 0x0001
          #endif
          #ifndef POLLPRI
          #define POLLPRI 0x0002
          #endif
          #ifndef POLLOUT
          #define POLLOUT 0x0004
          #endif
          #ifndef POLLERR
          #define POLLERR 0x0008
          #endif
          #ifndef POLLHUP
          #define POLLHUP 0x0010
          #endif
          #ifndef POLLRDNORM
          #define POLLRDNORM 0x0040
          #endif
          #ifndef POLLRDBAND
          #define POLLRDBAND 0x0080
          #endif
          #ifndef POLLWRNORM
          #define POLLWRNORM 0x0100
          #endif
          #ifndef POLLWRBAND
          #define POLLWRBAND 0x0200
          #endif
          #ifndef POLLMSG
          #define POLLMSG 0x0400
          #endif

          #ifndef EPOLLIN
          #define EPOLLIN POLLIN
          #endif
          #ifndef EPOLLPRI
          #define EPOLLPRI POLLPRI
          #endif
          #ifndef EPOLLOUT
          #define EPOLLOUT POLLOUT
          #endif
          #ifndef EPOLLERR
          #define EPOLLERR POLLERR
          #endif
          #ifndef EPOLLHUP
          #define EPOLLHUP POLLHUP
          #endif
          #ifndef EPOLLRDNORM
          #define EPOLLRDNORM POLLRDNORM
          #endif
          #ifndef EPOLLRDBAND
          #define EPOLLRDBAND POLLRDBAND
          #endif
          #ifndef EPOLLWRNORM
          #define EPOLLWRNORM POLLWRNORM
          #endif
          #ifndef EPOLLWRBAND
          #define EPOLLWRBAND POLLWRBAND
          #endif
          #ifndef EPOLLMSG
          #define EPOLLMSG POLLMSG
          #endif
          #ifndef EPOLLET
          #define EPOLLET (1U << 31)
          #endif
          #ifndef EPOLLONESHOT
          #define EPOLLONESHOT (1U << 30)
          #endif
          #ifndef EPOLLWAKEUP
          #define EPOLLWAKEUP (1U << 29)
          #endif
          #ifndef EPOLLEXCLUSIVE
          #define EPOLLEXCLUSIVE (1U << 28)
          #endif

          /* 常见 5.x+ 文件/内存标志兜底 */
          #ifndef REMAP_FILE_DEDUP
          #define REMAP_FILE_DEDUP (1 << 0)
          #endif
          #ifndef FMODE_NOWAIT
          #define FMODE_NOWAIT 0
          #endif
          #ifndef FMODE_UNSIGNED_OFFSET
          #define FMODE_UNSIGNED_OFFSET 0
          #endif
          #ifndef GFP_KERNEL_ACCOUNT
          #define GFP_KERNEL_ACCOUNT GFP_KERNEL
          #endif

          struct pt_regs;
          #ifndef _LINUX_SYSCALL_FN_T_DEFINED
          #define _LINUX_SYSCALL_FN_T_DEFINED
          typedef long (*syscall_fn_t)(const struct pt_regs *);
          #endif

          /* 高版本 GCC / FORTIFY / 调度符号弱兜底 */
          __attribute__((weak)) unsigned long nohz_flags(int cpu) { return 0; }
          __attribute__((weak)) void __bad_copy_from(void) {}
          __attribute__((weak)) void __bad_copy_to(void) {}
          __attribute__((weak)) void __read_overflow(void) {}
          __attribute__((weak)) void __write_overflow(void) {}
          __attribute__((weak)) void __read_overflow2(void) {}
          __attribute__((weak)) void __write_overflow2(void) {}
          __attribute__((weak)) void __read_overflow2_field(void) {}
          __attribute__((weak)) void __write_overflow2_field(void) {}
          #endif

          #ifndef FULL_THROTTLE_BOOST
          #define FULL_THROTTLE_BOOST 0
          #endif
          #ifndef CONSERVATIVE_BOOST
          #define CONSERVATIVE_BOOST 0
          #endif
          #ifndef NO_BOOST
          #define NO_BOOST 0
          #endif
          #ifndef EFI_HAVE_STUB
          #define EFI_HAVE_STUB 1
          #endif

          #endif
          COMPAT

          cat << 'PYEOF' > /tmp/fix_compat.py
          import os
          import re

          def patch_file(path, fn):
              if not os.path.exists(path):
                  return
              txt = open(path, 'r', encoding='utf-8', errors='ignore').read()
              new_txt = fn(txt)
              if new_txt != txt:
                  open(path, 'w', encoding='utf-8').write(new_txt)

          # 0. Linux 4.14 缺少 uapi/linux/mount.h，替换为 linux/mount.h
          if not os.path.exists('include/uapi/linux/mount.h'):
              for d in ['kernel/ksu', 'drivers/kernelsu']:
                  if os.path.exists(d):
                      for r, ds, fs in os.walk(d):
                          for f in fs:
                              if f.endswith(('.c', '.h')):
                                  patch_file(
                                  os.path.join(r, f),
                                  lambda t: re.sub(r'#include\s*<uapi/linux/mount\.h>', '#include <linux/mount.h>', t)
                              )

          # 0.5 Linux 4.14 fsnotify_ops 使用 handle_event 替代 handle_inode_event
          def fix_pkg_observer(t):
              t = re.sub(r'\.\s*handle_inode_event\s*=', '.handle_event =', t)
              return t
          patch_file('drivers/kernelsu/manager/pkg_observer.c', fix_pkg_observer)
          def fix_app_profile(t):
              t = re.sub(r'atomic_set\s*\(\s*&?current->seccomp\.filter_count\s*,[^;]*\)\s*;', '/* 4.14 seccomp has no filter_count */', t)
              t = re.sub(r'current->seccomp\.filter_count', 'current->seccomp.mode', t)
              return t
          patch_file('drivers/kernelsu/policy/app_profile.c', fix_app_profile)
          patch_file('drivers/kernelsu/policy/allowlist.c', lambda s: s.replace('fallthrough;', '/* fallthrough on 4.14 */'))
          patch_file('drivers/kernelsu/hook/lsm_hook.c', lambda s: s.replace('hook->list.list.pprev = &head->first;', 'hook->list.list.prev = (struct list_head *)head;').replace('hook->list.head->first', 'hook->list.head->next'))
          def fix_cpu_spoof(s):
              s = s.replace('#ifndef 0', '#ifndef VDSO_CLOCKMODE_ARCHTIMER')
              s = re.sub(r'vdso\s*\[[^\]]+\]\.clock_mode\s*=[^;]+;', '/* 4.14 skip vdso clock_mode */', s)
              s = re.sub(r'\(\*curr_cs_ptr\)->vdso_clock_mode\s*=[^;]+;', '/* 4.14 skip vdso_clock_mode */', s)
              s = re.sub(r'\*vd_default\s*=[^;]+;', '/* 4.14 skip vdso clock_mode */', s)
              s = s.replace('(enum vdso_clock_mode *)find_kernel_symbol_exact', '(void *)find_kernel_symbol_exact')
              s = re.sub(r'if\s*\(\s*(?:0\s*&&\s*)?vd_default\s*\)', 'if (0)', s)
              s = re.sub(r'\}\s*else\s*if\s*\(0\)\s*\{', '} else {', s)
              s = re.sub(r'([^;\{\}]\s*)\n(\s*if \(0\) \{)', r'\1;\n\2', s)
              for idx, ln in enumerate(s.splitlines(), 1):
                  if 175 <= idx <= 195:
                      print(f'[cpu_spoof:{idx}] {ln}')
              return s
          patch_file('drivers/kernelsu/extension/cpu_spoof.c', fix_cpu_spoof)
          def fix_selinux_c(s):
              if 'extern int selinux_enforcing;' not in s:
                  s = 'extern int selinux_enforcing;\n' + s
              s = s.replace('selinux_state.enforcing', 'selinux_enforcing')
              return s
          def fix_dispatch_c(s: str) -> str:
              decl = (
                  '#include <linux/sched/task.h>\n'
                  'extern rwlock_t tasklist_lock;\n'
                  'extern struct task_struct init_task;\n'
              )
              if 'extern struct task_struct init_task;' not in s:
                  s = decl + s
              return s
          patch_file('drivers/kernelsu/supercall/dispatch.c', fix_dispatch_c)
          def fix_selinux_hide_c(s: str) -> str:
              hdr = (
                  '#include <linux/mutex.h>\n'
                  '#ifndef _KSU_414_SELINUX_TYPES_H\n'
                  '#define _KSU_414_SELINUX_TYPES_H\n'
                  'struct ebitmap;\n'
                  'struct sidtab;\n'
                  'struct policydb;\n'
                  'struct ksu_414_sepolicy_holder { void *sidtab; unsigned char policydb[256]; int latest_granting; unsigned char _pad[64]; };\n'
                  '#endif\n'
                  '#ifndef _KSU_414_HIDE_TYPES_H\n'
                  '#define _KSU_414_HIDE_TYPES_H\n'
                  'struct selinux_policy { void *sidtab; unsigned char policydb[256]; int latest_granting; unsigned char _pad[64]; };\n'
                  'struct sidtab_entry { void *_pad[8]; };\n'
                  'static struct ksu_414_sepolicy_holder _ksu_414_hide_pol_dummy;\n'
                  'static struct ksu_414_sepolicy_holder *_ksu_414_hide_pol_ptr = &_ksu_414_hide_pol_dummy;\n'
                  'struct _ksu_414_selinux_state_s { void *policy; struct mutex status_lock; void *status_page; };\n'
                  'static struct _ksu_414_selinux_state_s _ksu_414_selinux_state_dummy = { &_ksu_414_hide_pol_dummy, __MUTEX_INITIALIZER(_ksu_414_selinux_state_dummy.status_lock), NULL };\n'
                  '#endif\n'
              )
              if '_KSU_414_HIDE_TYPES_H' not in s:
                  s = hdr + s
              s = re.sub(r'(#define\s+ksu_avc_has_perm_compat\([^)]*\))[^\n]*', r'\1 avc_has_perm(__VA_ARGS__)', s)
              s = re.sub(r'(#define\s+ksu_security_bounded_transition_compat\([^)]*\))[^\n]*', r'\1 security_bounded_transition(__VA_ARGS__)', s)
              s = re.sub(r'(#define\s+ksu_security_validate_transition_compat\([^)]*\))[^\n]*', r'\1 security_validate_transition(__VA_ARGS__)', s)
              s = re.sub(r'\bCAP_OPT_NOAUDIT\b', '0', s)
              s = s.replace('selinux_state.policy', '_ksu_414_hide_pol_ptr')
              s = re.sub(r'\bselinux_state\b', '_ksu_414_selinux_state_dummy', s)
              s = re.sub(r'\btype_val_to_struct\b', 'role_val_to_struct', s)
              s = re.sub(r'mls_compute_context_len\s*\(\s*[^,()]+\s*,\s*([^)]+)\)', r'mls_compute_context_len(\1)', s)
              s = re.sub(r'mls_sid_to_context\s*\(\s*[^,()]+\s*,\s*([^,()]+)\s*,\s*([^)]+)\)', r'mls_sid_to_context(\1, \2)', s)
              s = s.replace('context_struct_to_string(p, &entry->context, scontext, scontext_len)', '((scontext && (*scontext = NULL)), (scontext_len && (*scontext_len = 0)), 0)')
              return s
          patch_file('drivers/kernelsu/feature/selinux_hide.c', fix_selinux_hide_c)
          def fix_avc_spoof_c(s: str) -> str:
              s = re.sub(r'\bpr_(info|warn|err|notice|debug)_ratelimited\s*\(', r'pr_\1(', s)
              s = re.sub(r'\bprintk_ratelimited\s*\(', 'printk(', s)
              return s
          patch_file('drivers/kernelsu/feature/avc_spoof.c', fix_avc_spoof_c)
          def fix_access_ok_2arg(s: str) -> str:
              return re.sub(
                  r'\baccess_ok\s*\(\s*([^,()]+(?:\([^()]*\))?)\s*,\s*([^,()]+(?:\([^()]*\))?)\s*\)',
                  r'access_ok(VERIFY_WRITE, \1, \2)',
                  s,
              )
          patch_file('drivers/kernelsu/extension/kpm/kpm.c', fix_access_ok_2arg)
          patch_file('drivers/kernelsu/selinux/selinux.c', fix_selinux_c)
          def fix_rules_c(s: str) -> str:
              s = s.replace('selinux_policy_414_ptr_mutex', 'selinux_policy_414_lock')
              s = s.replace('selinux_policy_414_ptr_lock', 'selinux_policy_414_lock')
              s = s.replace('selinux_state.policy_mutex', 'selinux_policy_414_lock')
              s = s.replace('selinux_state.policy', 'selinux_policy_414_ptr')
              s = s.replace('selinux_state.avc', 'NULL')
              s = s.replace('selinux_state.enforcing', 'selinux_enforcing')
              s = re.sub(r'\bselinux_state\b', 'selinux_enforcing', s)
              s = re.sub(r'\bstruct\s+selinux_policy\b', 'struct ksu_414_sepolicy_holder', s)
              s = re.sub(r'struct\s+ksu_414_policydb\s*\{[^}]*\}\s*;', '', s)
              s = re.sub(r'struct\s+ksu_414_sidtab\s*\{[^}]*\}\s*;', '', s)
              s = re.sub(r'struct\s+ksu_414_sepolicy_holder\s*\{[^}]*\}\s*;', '', s)
              s = re.sub(
                  r'selinux_status_update_policyload\s*\(\s*&?selinux_[a-zA-Z0-9_]+\s*,\s*([^\)]+)\)',
                  r'selinux_status_update_policyload(\1)',
                  s,
              )
              fixed_lines = []
              for ln in s.splitlines(True):
                  if 'rcu_dereference_protected(' in ln and ';' in ln:
                      semi_idx = ln.rfind(';')
                      head = ln[:semi_idx]
                      tail = ln[semi_idx:]
                      diff = head.count('(') - head.count(')')
                      if diff > 0:
                          head = head + (')' * diff)
                      elif diff < 0:
                          for _ in range(-diff):
                              p = head.rfind(')')
                              if p != -1:
                                  head = head[:p] + head[p+1:]
                      ln = head + tail
                  fixed_lines.append(ln)
              s = ''.join(fixed_lines)
              header_414 = (
                  '#include <linux/rcupdate.h>\n'
                  '#include <linux/lockdep.h>\n'
                  '#include <linux/mutex.h>\n'
                  '#include <linux/slab.h>\n'
                  'extern int selinux_enforcing;\n'
                  '#ifndef _KSU_414_SELINUX_TYPES_H\n'
                  '#define _KSU_414_SELINUX_TYPES_H\n'
                  'struct ksu_414_sidtab { unsigned char _pad[64]; };\n'
                  'struct ksu_414_policydb { unsigned char _pad[256]; };\n'
                  'struct ksu_414_sepolicy_holder { struct ksu_414_sidtab *sidtab; struct ksu_414_policydb policydb; int latest_granting; unsigned char _pad[64]; };\n'
                  '#endif\n'
                  'static struct ksu_414_sepolicy_holder selinux_policy_414_dummy;\n'
                  'static struct ksu_414_sepolicy_holder *selinux_policy_414_ptr = &selinux_policy_414_dummy;\n'
                  'static DEFINE_MUTEX(selinux_policy_414_lock);\n'
                  'static inline int ksu_414_policydb_load_isids(void *p, void *s) { (void)p; (void)s; return 0; }\n'
                  'static inline bool ksu_414_set_original_types(void *db, void *old_db, int g) { (void)db; (void)old_db; (void)g; return true; }\n'
                  'static inline bool ksu_414_advance_original_types(void *db, void *old_db, int og, int ng) { (void)db; (void)old_db; (void)og; (void)ng; return true; }\n'
              )
              s = re.sub(r'\bpolicydb_load_isids\b', 'ksu_414_policydb_load_isids', s)
              s = re.sub(r'\bksu_set_original_types\b', 'ksu_414_set_original_types', s)
              s = re.sub(r'\bksu_advance_original_types\b', 'ksu_414_advance_original_types', s)
              if 'selinux_policy_414_dummy' not in s:
                  s = header_414 + s
              return s
          patch_file('drivers/kernelsu/selinux/rules.c', fix_rules_c)
          def fix_sepolicy_c(s: str) -> str:
              h_path = 'drivers/kernelsu/selinux/sepolicy.h'
              types_guard = (
                  '#ifndef _KSU_414_SELINUX_TYPES_H\n'
                  '#define _KSU_414_SELINUX_TYPES_H\n'
                  'struct ebitmap;\n'
                  'struct sidtab;\n'
                  'struct policydb;\n'
                  'struct ksu_414_sidtab { unsigned char _pad[64]; };\n'
                  'struct ksu_414_policydb { unsigned char _pad[256]; };\n'
                  'struct ksu_414_sepolicy_holder { struct ksu_414_sidtab *sidtab; struct ksu_414_policydb policydb; int latest_granting; unsigned char _pad[64]; };\n'
                  '#endif\n'
              )
              if os.path.exists(h_path):
                  h_txt = open(h_path, 'r', encoding='utf-8', errors='ignore').read()
                  h_hdr = (
                      '#include <linux/types.h>\n'
                      '#include <linux/flex_array.h>\n'
                      '#include <linux/mutex.h>\n'
                      + types_guard +
                      'struct selinux_policy;\n'
                  )
                  if '_KSU_414_SELINUX_TYPES_H' not in h_txt:
                      open(h_path, 'w', encoding='utf-8').write(h_hdr + h_txt)

              hdr = (
                  '#include <linux/flex_array.h>\n'
                  '#include <linux/slab.h>\n'
                  '#include <linux/string.h>\n'
                  '#ifndef POLICYDB_CONFIG_ANDROID_NETLINK_ROUTE\n'
                  '#define POLICYDB_CONFIG_ANDROID_NETLINK_ROUTE (1 << 0)\n'
                  '#endif\n'
                  '#ifndef POLICYDB_CONFIG_ANDROID_NETLINK_GETNEIGH\n'
                  '#define POLICYDB_CONFIG_ANDROID_NETLINK_GETNEIGH (1 << 1)\n'
                  '#endif\n'
                  '#ifndef SYM_TYPES\n'
                  '#define SYM_TYPES 1\n'
                  '#endif\n'
                  + types_guard +
                  'struct ksu_414_filename_trans_key { u32 stype; u32 ttype; u16 tclass; const char *name; };\n'
                  'struct ksu_414_filename_trans_datum { u32 otype; unsigned char _stypes_pad[40]; struct ksu_414_filename_trans_datum *next; };\n'
                  'static inline int ksu_414_hashtab_insert_4(struct hashtab *h, void *k, void *d, const void *fn) { (void)fn; return hashtab_insert(h, k, d); }\n'
                  'static inline void *ksu_414_flex_get_ptr(void *fa, unsigned int idx) { void *p = NULL; if (!fa) return NULL; return flex_array_get((struct flex_array *)fa, idx) ? *(void **)flex_array_get((struct flex_array *)fa, idx) : p; }\n'
                  'static inline int ksu_414_flex_put_ptr(void *fa, unsigned int idx, const void *val) { if (!fa) return 0; return flex_array_put((struct flex_array *)fa, idx, &val, GFP_KERNEL); }\n'
              )
              if 'ksu_414_flex_get_ptr' not in s:
                  s = hdr + s

              s = s.replace('ksu_414_sepolicy_holder', 'selinux_policy')
              s = re.sub(r'\bstruct\s+filename_trans_key\b', 'struct ksu_414_filename_trans_key', s)
              s = re.sub(r'\bstruct\s+filename_trans_datum\b', 'struct ksu_414_filename_trans_datum', s)
              s = s.replace('filenametr_key_params', 'NULL')

              s = re.sub(
                  r'\bhashtab_insert\s*\(\s*([^,()]+)\s*,\s*([^,()]+)\s*,\s*([^,()]+)\s*,\s*([^()]+)\)',
                  r'ksu_414_hashtab_insert_4(\1, \2, \3, \4)',
                  s,
              )
              s = re.sub(
                  r'\bhashtab_insert\s*\(\s*([^,()]+)\s*,\s*([^,()]+)\s*,\s*([^()]+)\)',
                  r'ksu_414_hashtab_insert_4(\1, \2, \3, NULL)',
                  s,
              )

              s = s.replace('db->compat_filename_trans_count', 'db->p_types.nprim')
              s = re.sub(r'\bdb->type_val_to_struct\b', 'db->role_val_to_struct', s)

              s = re.sub(
                  r'n\s*=\s*db->te_avtab\.htable\[([^\]]+)\]',
                  r'n = (struct avtab_node *)ksu_414_flex_get_ptr(&db->te_avtab.htable[\1], 0)',
                  s,
              )
              s = re.sub(
                  r'db->te_avtab\.htable\[([^\]]+)\]\s*=\s*([^;]+);',
                  r'ksu_414_flex_put_ptr(&db->te_avtab.htable[\1], 0, \2);',
                  s,
              )
              s = re.sub(
                  r'removed\.htable\[0\]\s*=\s*([^;]+);',
                  r'(void)(\1);',
                  s,
              )
              s = re.sub(
                  r'db->sym_val_to_name\[([^\]]+)\]\[([^\]]+)\]\s*=\s*([^;]+);',
                  r'ksu_414_flex_put_ptr(&db->sym_val_to_name[\1][\2], 0, \3);',
                  s,
              )

              s = re.sub(r'\b(old_pol|new_pol)->policydb\.len\s*=\s*([^;]+);', r'(void)(\2);', s)
              s = re.sub(r'\b(old_pol|new_pol)->policydb\.len\b', '0', s)
              s = re.sub(r'\bold_pol->policydb\.android_netlink_route\b', '0', s)
              s = re.sub(r'\bold_pol->policydb\.android_netlink_getneigh\b', '0', s)
              s = re.sub(r'\bpolicydb_write\s*\([^;]*\);', '0;', s)
              s = re.sub(r'\bpolicydb_read\s*\([^;]*\);', '0;', s)
              s = re.sub(r'ebitmap_get_bit\s*\(\s*&trans->stypes\b[^;]*?\)\s*\)', '0)', s, flags=re.S)
              s = re.sub(r'ebitmap_get_bit\s*\(\s*&trans->stypes\b[^;]*?\)', '0', s, flags=re.S)
              s = re.sub(r'return\s+ebitmap_set_bit\s*\(\s*&trans->stypes\b[^;]*?==\s*0\s*;', 'return true;', s, flags=re.S)
              s = re.sub(r'ebitmap_set_bit\s*\(\s*&trans->stypes\b[^;]*?;', '0;', s, flags=re.S)
              return s
          patch_file('drivers/kernelsu/selinux/sepolicy.c', fix_sepolicy_c)
          def fix_lsm(t):
              t = t.replace('slot = (void **)&hook->list.head->first;', 'slot = (void **)&hook->list.head->next;')
              t = re.sub(
                  r'hlist_for_each_entry\s*\(\s*entry\s*,\s*head\s*,\s*list\s*\)',
                  'list_for_each_entry(entry, (struct list_head *)(head), list)',
                  t
              )
              t = re.sub(
                  r'hlist_entry\s*\(\s*head->first\s*,\s*struct\s+security_hook_list\s*,\s*list\s*\)',
                  'list_first_entry_or_null((struct list_head *)(head), struct security_hook_list, list)',
                  t
              )
              t = t.replace('hook->list.list.pprev = &head->first;', 'hook->list.list.prev = (struct list_head *)head;')
              t = t.replace('hook->list.head->first', 'hook->list.head->next')
              return t
          patch_file('drivers/kernelsu/hook/lsm_hook.c', fix_lsm)

          # 3. 4.14 file_operations 缺失字段（iopoll / remap_file_range / fadvise / mmap_supported_flags）兜底
          def fix_fw(t):
              t = re.sub(r'orig->f_op->iopoll\s*\([^;]*\)', '-EOPNOTSUPP', t)
              t = re.sub(r'orig->f_op->remap_file_range\s*\([^;]*\)', '-EOPNOTSUPP', t)
              t = re.sub(r'if\s*\(\s*orig->f_op->fadvise\s*\)\s*\{[^}]*\}', 'return -EOPNOTSUPP;', t, flags=re.S)
              t = re.sub(r'orig->f_op->fadvise\s*\([^;]*\)', '-EOPNOTSUPP', t)
              t = re.sub(r'p->ops\.iopoll\s*=\s*[^;]*;', '/* iopoll unsupported on 4.14 */', t)
              t = re.sub(r'p->ops\.mmap_supported_flags\s*=\s*[^;]*;', '/* mmap_supported_flags unsupported on 4.14 */', t)
              t = re.sub(r'p->ops\.remap_file_range\s*=\s*[^;]*;', '/* remap_file_range unsupported on 4.14 */', t)
              t = re.sub(r'p->ops\.fadvise\s*=\s*[^;]*;', '/* fadvise unsupported on 4.14 */', t)
              return t
          patch_file('drivers/kernelsu/infra/file_wrapper.c', fix_fw)

          # 4. 批量为 SukiSU 目录注入 sukisu_compat.h 并清理高版本内核独有 trace/boost 符号
          for d in ['kernel/ksu', 'drivers/kernelsu']:
              if os.path.exists(d):
                  for r, ds, fs in os.walk(d):
                      for f in fs:
                          fp = os.path.join(r, f)
                          if f.endswith('.c'):
                              def add_inc(t):
                                  return ('#include <linux/sukisu_compat.h>\n' + t) if 'sukisu_compat.h' not in t else t
                              patch_file(fp, add_inc)
                          if f.endswith(('.c', '.h')):
                              def clean_ksu(t):
                                  t = re.sub(r'trace_sched_.*?;', '/* removed */', t)
                                  t = re.sub(r'sched_boost\s*\([^)]*\);', '/* removed */', t)
                                  return t
                              patch_file(fp, clean_ksu)

          # 5. 调度器 FULL_THROTTLE_BOOST 与 sched_boost 左值赋值兼容
          boost_def = '#undef FULL_THROTTLE_BOOST\n#define FULL_THROTTLE_BOOST 0\n'
          for p in ['kernel/sched/rt.c', 'kernel/sched/fair.c']:
              def fix_sched(t):
                  if boost_def not in t:
                      t = boost_def + t
                  t = re.sub(r'sched_boost\s*\(\)\s*=\s*FULL_THROTTLE_BOOST\s*;', '/* removed invalid lvalue */', t)
                  return t
              patch_file(p, fix_sched)

          if os.path.exists('kernel/sched'):
              for r, ds, fs in os.walk('kernel/sched'):
                  for f in fs:
                      if f.endswith('.c') and f not in ('rt.c', 'fair.c'):
                          fp = os.path.join(r, f)
                      patch_file(fp, lambda t: (boost_def + t) if ('FULL_THROTTLE_BOOST' in t and boost_def not in t) else t)

          # 6. EFI stub TEXT_OFFSET 与 mm/huge_memory.c 枚举类型转换兼容
          def fix_efi(t):
              lines = t.splitlines(True)
              out = []
              if not any('TEXT_OFFSET' in l and ('#ifndef' in l or '#define' in l) for l in lines):
                  out.append('#ifndef TEXT_OFFSET\n#define TEXT_OFFSET 0\n#endif\n')
              for l in lines:
                  if l.lstrip().startswith('#'):
                      out.append(l)
                  else:
                      out.append(re.sub(r'\bTEXT_OFFSET\b', '0', l))
              return ''.join(out)
          patch_file('drivers/firmware/efi/libstub/arm64-stub.c', fix_efi)

          patch_file('mm/huge_memory.c', lambda t: t.replace('try_to_unmap(page, ttu_flags);', 'try_to_unmap(page, (enum ttu_flags)ttu_flags);'))
          PYEOF

          python3 -m py_compile /tmp/fix_compat.py
          python3 /tmp/fix_compat.py
          grep -n -C 2 "pprev\|->first" drivers/kernelsu/hook/lsm_hook.c || true
          find . -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | xargs sed -i '/#error/d' || true

      - name: 4. 注入 VDSO 桩与清理状态
        run: |
          git checkout Makefile arch/arm64/Makefile arch/arm64/kernel/signal.c || true
          if [ -f arch/arm64/Makefile ]; then
            sed -i '/vdso_prepare/s/^/# /' arch/arm64/Makefile || true
          fi
          mkdir -p include/generated arch/arm64/include/generated
          printf "#ifndef __VDSO_OFFSETS_H\n#define __VDSO_OFFSETS_H\n#define vdso_offset_sigtramp 0\n#define vdso_offset_rt_sigtramp 0\n#endif\n" > include/generated/vdso-offsets.h
          cp include/generated/vdso-offsets.h arch/arm64/include/generated/vdso-offsets.h || true
          printf "gcc-plugins:\n\t@true\nall:\n\t@true\nclean:\n\t@true\n" > scripts/Makefile.gcc-plugins

      - name: 5. 智能匹配配置与绝对纯净的 prepare0 预生成
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          CONFIG_FILE=$(find arch/arm64/configs -type f \( -iname "*16t*" -o -iname "*meizu*" -o -iname "*sm8150*" -o -iname "*sdm855*" \) | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=$(find arch/arm64/configs -type f -name "*_defconfig" ! -name "defconfig" | head -n 1)
          fi
          if [ -n "$CONFIG_FILE" ]; then
            CONFIG_REL=${CONFIG_FILE#arch/arm64/configs/}
            echo "Using config file: $CONFIG_FILE (target: $CONFIG_REL)"
            make O=out "$CONFIG_REL" || make O=out alldefconfig
          else
            echo "No specific defconfig found, falling back to alldefconfig"
            make O=out alldefconfig
          fi

          for sym in FORTIFY_SOURCE EFI_STUB CC_STACKPROTECTOR_STRONG CC_STACKPROTECTOR_REGULAR GCC_PLUGINS VDSO; do
            sed -i "s/CONFIG_${sym}=y/# CONFIG_${sym} is not set/g" out/.config || true
            echo "# CONFIG_${sym} is not set" >> out/.config
          done
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_KRETPROBES is not set/CONFIG_KRETPROBES=y/g' out/.config || true
          sed -i 's/# CONFIG_HAVE_SYSCALL_TRACEPOINTS is not set/CONFIG_HAVE_SYSCALL_TRACEPOINTS=y/g' out/.config || true
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KRETPROBES=y" >> out/.config
          echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y" >> out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

          sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/g' out/.config || true
          echo 'CONFIG_KPM=y' >> out/.config
          (yes "" 2>/dev/null || true) | make O=out olddefconfig >/dev/null 2>&1 || (yes "" 2>/dev/null || true) | make O=out oldconfig >/dev/null 2>&1 || true
          for sym in FORTIFY_SOURCE EFI_STUB CC_STACKPROTECTOR_STRONG CC_STACKPROTECTOR_REGULAR GCC_PLUGINS VDSO; do
            sed -i "s/CONFIG_${sym}=y/# CONFIG_${sym} is not set/g" out/.config || true
          done
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          make O=out -j`nproc` CC=aarch64-linux-gnu-gcc HOSTCC=gcc HOSTCFLAGS="-std=gnu89 -fcommon" KCFLAGS="-w -Wno-error" CROSS_COMPILE=aarch64-linux-gnu- prepare0

      - name: 6. 正式全速编译内核镜像并修复 vmlinux.lds 链接脚本
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          if [ ! -e arch/arm64/include/asm/sizes.h ] && [ -f include/asm-generic/sizes.h ]; then
            printf "#include <asm-generic/sizes.h>\n" > arch/arm64/include/asm/sizes.h
          fi
          rm -f arch/arm64/kernel/vmlinux.lds
          KBUILD_ARGS=(
            O=out
            -j`nproc`
            CC=aarch64-linux-gnu-gcc
            HOSTCC=gcc
            HOSTCFLAGS="-std=gnu89 -fcommon"
            HOSTLDFLAGS="-fcommon"
            CROSS_COMPILE=aarch64-linux-gnu-
            KCFLAGS="-w -Wno-error -include linux/sukisu_compat.h -include linux/sched.h -DCLONE_VM=0x100 -DCLONE_FS=0x200 -DCLONE_FILES=0x400 -DCLONE_SIGHAND=0x800 -DCLONE_NEWNS=0x20000 -DCLONE_SYSVSEM=0x40000"
            CONFIG_NO_ERROR_ON_MISMATCH=y
          )
          make "${KBUILD_ARGS[@]}" || true
          mkdir -p out/arch/arm64/kernel
          if [ ! -s out/arch/arm64/kernel/vmlinux.lds ] && [ -f arch/arm64/kernel/vmlinux.lds.S ]; then
            AUTOCONF_INC=""
            [ -f out/include/generated/autoconf.h ] && AUTOCONF_INC="-include out/include/generated/autoconf.h"
            aarch64-linux-gnu-gcc -E -P -C -x assembler-with-cpp \
              $AUTOCONF_INC \
              -Iinclude \
              -Iinclude/asm-generic \
              -Iarch/arm64/include \
              -Iarch/arm64/include/generated \
              -Iout/include \
              -Iout/include/generated \
              -Iout/arch/arm64/include \
              -Iout/arch/arm64/include/generated \
              -D__ASSEMBLY__ \
              -DCONFIG_64BIT \
              arch/arm64/kernel/vmlinux.lds.S -o out/arch/arm64/kernel/vmlinux.lds || true
          fi
          if [ -s out/arch/arm64/kernel/vmlinux.lds ]; then
            awk '!/^[[:space:]]*(#|$|extern |typedef |__attribute__)/' out/arch/arm64/kernel/vmlinux.lds > /tmp/vmlinux.lds.clean && mv /tmp/vmlinux.lds.clean out/arch/arm64/kernel/vmlinux.lds || true
            cp out/arch/arm64/kernel/vmlinux.lds arch/arm64/kernel/vmlinux.lds
          fi
          make "${KBUILD_ARGS[@]}"

      - name: 7. 生成 AnyKernel3 刷机包并上传
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=`find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1`
          if [ -z "$IMG_PATH" ]; then
            echo "Error: Kernel image not found!"
            exit 1
          fi
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel && zip -r ../Meizu-16T-PureSukiSU-Kernel.zip *

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-PureSukiSU-Kernel
          path: Meizu-16T-PureSukiSU-Kernel.zip
