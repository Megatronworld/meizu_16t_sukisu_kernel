name: Build Meizu 16T SukiSU Ultra Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出魅族 sm8150 平台内核源码
        run: |
          git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git . -b mkq-mr1 || git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_msm8150.git . -b lineage-20

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget python3 zip lld git

      - name: 3. 下载 AOSP Clang 工具链
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://gitlab.com/Leona-Sec/aosp-clang.git toolchain || git clone --depth=1 https://github.com/ZyCromerZ/Clang.git toolchain || git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902b.git toolchain

      - name: 4. 下载集成 SukiSU Ultra 源码 (改用 git clone 避免 404)
        run: |
          git clone --depth=1 https://github.com/rsuntk/SukiSU-Ultra.git sukisu_source
          if [ -d sukisu_source/kernel ]; then
            if [ -f sukisu_source/kernel/setup.sh ]; then
              bash sukisu_source/kernel/setup.sh
            else
              cp -rf sukisu_source/kernel/* ./
            fi
          else
            cp -rf sukisu_source/* ./
          fi

      - name: 5. 暴力删除 VDSO 目录以彻底杜绝报错
        run: |
          rm -rf arch/arm64/kernel/vdso
          rm -rf arch/arm64/vdso

      - name: 6. 开始编译内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/bin:$(pwd)/toolchain/llvm/bin:$PATH"
          mkdir -p out
          
          CONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          echo "Using config: $CONFIG_NAME"
          
          make O=out "$CONFIG_NAME"
          
          make O=out -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            HOSTCFLAGS="-std=gnu89"

      - name: 7. 打包为 AnyKernel3 刷机包
        run: |
          git clone --depth=1 https://github.com/kernel-sakers/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          IMG_PATH=$(find out/ -name "Image.gz-dtb" -o -name "Image" | head -n 1)
          cp "$IMG_PATH" anykernel/Image.gz-dtb
          cd anykernel
          zip -r ../Meizu-16T-SukiSU-Ultra-Kernel.zip *

      - name: 8. 上传构建刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Meizu-16T-SukiSU-Ultra-Kernel
          path: Meizu-16T-SukiSU-Ultra-Kernel.zip
